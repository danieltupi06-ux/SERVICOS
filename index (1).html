<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal de Requisições de Serviços de Terceiros – PCM</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--g:#14532d;--g2:#1f7a45;--gl:#e7f1ea;--bg:#f5f7f4;--card:#fff;--tx:#1b2a21;--mu:#64756b;--bd:#d9e2db;--red:#b42318;--amb:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--g:#7fd1a0;--g2:#5cb985;--gl:#1d2e24;--bg:#111a15;--card:#18231c;--tx:#e6efe9;--mu:#9bb0a3;--bd:#2c3d32;--red:#f97066;--amb:#fbbf24;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font:15px/1.4 system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx);display:flex}
nav{width:230px;background:#14532d;color:#fff;padding:18px 12px;flex:none;display:flex;flex-direction:column;gap:4px;overflow:auto}
nav h1{font-size:15px;margin:0 8px 14px;line-height:1.3}nav h1 small{display:block;font-weight:400;opacity:.75;margin-top:2px}
nav button{background:none;border:0;color:#fff;text-align:left;padding:10px 12px;border-radius:8px;font-size:14px;cursor:pointer;opacity:.85}
nav button.on,nav button:hover{background:rgba(255,255,255,.16);opacity:1}
main{flex:1;min-width:0;overflow:auto;padding:22px}
h2{margin:0 0 14px;color:var(--g);font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--g);border-radius:10px;padding:12px}
.kpi b{display:block;font-size:26px;color:var(--g)}.kpi span{color:var(--mu);font-size:13px}.kpi.bad{border-left-color:var(--red)}.kpi.bad b{color:var(--red)}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
label{display:block;font-size:12px;color:var(--mu);font-weight:600}
input,select,textarea{width:100%;margin-top:3px;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
textarea{min-height:80px}input[readonly]{background:var(--gl)}
.btn{background:var(--g);color:var(--bg);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
nav,.dh{--bg:#fff}.btn.alt{background:var(--gl);color:var(--g)}.btn:disabled{opacity:.5}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.full{grid-column:1/-1}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--gl);color:var(--g);text-align:left;padding:9px;white-space:nowrap}td{padding:9px;border-bottom:1px solid var(--bd);vertical-align:top}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--gl)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--gl);color:var(--g);white-space:nowrap}
.tag.p{background:#fef3c7;color:#92400e}.tag.a{background:#fee4e2;color:var(--red)}.tag.c{background:#e5e7eb;color:#4b5563}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chips button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 14px;cursor:pointer}.chips .on{background:var(--g);color:var(--bg);border-color:var(--g)}
dialog{border:0;border-radius:14px;max-width:760px;width:94vw;padding:0;background:var(--card);color:var(--tx)}dialog::backdrop{background:rgba(0,0,0,.45)}
.dh{padding:14px 18px;background:var(--g);color:#fff;display:flex;justify-content:space-between;align-items:center}.dh button{background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.db{padding:18px;max-height:78vh;overflow:auto}.hist{font-size:13px;border-left:3px solid var(--g2);padding-left:10px;margin:6px 0}.hist small{color:var(--mu)}
.note{font-size:13px;color:var(--mu)}.ok{color:var(--g);font-weight:600}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
@media(max-width:760px){body{flex-direction:column}nav{width:100%;flex-direction:row;flex-wrap:wrap;padding:10px;gap:2px}nav h1{width:100%;margin:0 4px 6px}nav button{padding:8px 10px;font-size:13px}main{padding:14px}}
</style></head><body>
<nav><h1>Usina Ipê<small>Requisições de Terceiros – PCM</small></h1>
<button data-v="home">📊 Painel principal</button><button data-v="new">📝 Nova solicitação</button><button data-v="pcm">🛠️ Painel do PCM</button><button data-v="eq">🚜 Controle de equipamentos</button><button data-v="fr">📁 Base de frota</button></nav>
<main id="m"></main>
<dialog id="dlg"><div class="dh"><b id="dt"></b><button onclick="dlg.close()">×</button></div><div class="db" id="dbody"></div></dialog>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ST=["Pendente","Requisição aberta","Enviado","Em execução","Retornou","Cancelada"];
const today=()=>new Date().toISOString().slice(0,10),fd=d=>d?d.slice(8,10)+"/"+d.slice(5,7)+"/"+d.slice(0,4):"—",fdt=d=>d?new Date(d).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}):"";
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}};
let err="",reqs=[],frota=[],view="home",F={f:"",s:"",g:"",a:"",b:""},chip="",pf="pend",db=null,msg="";
const emTerc=r=>r.st=="Enviado"||r.st=="Em execução",atras=r=>emTerc(r)&&r.prev&&r.prev<today();
const tagc=r=>atras(r)?"a":r.st=="Pendente"?"p":r.st=="Cancelada"?"c":"";
const stLabel=r=>atras(r)?r.st+" · ATRASADO":r.st;
// ---------- armazenamento (compartilhado via db; local se indisponível)
const SB="https://mrcxnfzpddkjpbmsmway.supabase.co",KEY="COLE_AQUI_A_CHAVE_ANON_PUBLICA";
const on=()=>!KEY.startsWith("COLE");
const api=(p,o={})=>fetch(SB+"/rest/v1/"+p,{...o,headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal",...(o.headers||{})}}).then(async r=>{if(!r.ok)throw new Error((await r.text())||r.status);return r.status==204||r.headers.get("content-length")=="0"?null:r.json().catch(()=>null)});
const rs=()=>{const a=document.activeElement;if(view=='new'&&a&&/INPUT|TEXTAREA/.test(a.tagName))return;render()};
async function load(){try{const a=await api("req?select=dados"),c=await api("cfg?chave=eq.frota&select=dados");reqs=(a||[]).map(x=>x.dados);frota=(c&&c[0]&&c[0].dados.rows)||[];err="";}catch(e){err="Erro de conexão com o banco: "+e.message}rs()}
async function init(){db=on();
 if(db){await load();setInterval(load,15000)}
 else{try{reqs=JSON.parse(ls("ipe_req")||"[]");frota=JSON.parse(ls("ipe_frota")||"[]")}catch(e){}}
 render();
}
async function saveReq(r){if(db){await api("req",{method:"POST",body:JSON.stringify({id:r.id,dados:r,atualizado:new Date().toISOString()})});reqs=reqs.filter(x=>x.id!=r.id).concat(r);render()}else{reqs=reqs.filter(x=>x.id!=r.id).concat(r);ls("ipe_req",JSON.stringify(reqs));render()}}
async function saveFrota(rows){if(db){await api("cfg",{method:"POST",body:JSON.stringify({chave:"frota",dados:{rows}})});frota=rows}else{frota=rows;ls("ipe_frota",JSON.stringify(rows))}render()}
async function delRemote(id){if(db)await api("req?id=eq."+encodeURIComponent(id),{method:"DELETE"});reqs=reqs.filter(x=>x.id!=id);if(!db)ls("ipe_req",JSON.stringify(reqs))}
const who=()=>ls("ipe_who")||"";
function askWho(){let w=who();if(!w){w=prompt("Seu nome (aparecerá no histórico):")||"";if(w)ls("ipe_who",w)}return w||"Não informado"}
// ---------- filtros
function filt(l){return l.filter(r=>(!F.f||r.fr==F.f)&&(!F.s||(r.fn==F.s||r.forn==F.s))&&(!F.g||r.ge==F.g)&&(!F.a||r.dt.slice(0,10)>=F.a)&&(!F.b||r.dt.slice(0,10)<=F.b))}
function fbar(){const u=k=>[...new Set(reqs.map(r=>r[k]).filter(Boolean))].sort();
 const o=(a,v)=>'<option value="">Todos</option>'+a.map(x=>`<option ${x==v?"selected":""}>${esc(x)}</option>`).join("");
 return `<div class="card fl"><label>Frota<select onchange="F.f=this.value;render()">${o(u("fr"),F.f)}</select></label>
<label>Fornecedor<select onchange="F.s=this.value;render()">${o([...new Set(reqs.flatMap(r=>[r.fn,r.forn]).filter(Boolean))].sort(),F.s)}</select></label>
<label>Gestor<select onchange="F.g=this.value;render()">${o(u("ge"),F.g)}</select></label>
<label>De<input type="date" value="${F.a}" onchange="F.a=this.value;render()"></label><label>Até<input type="date" value="${F.b}" onchange="F.b=this.value;render()"></label>
<button class="btn alt" onclick="F={f:'',s:'',g:'',a:'',b:''};render()">Limpar</button></div>`}
function table(l,cols,click){if(!l.length)return '<p class="note">Nenhum registro.</p>';
 return `<div class="tw"><table><tr>${cols.map(c=>"<th>"+c[0]+"</th>").join("")}</tr>${l.map(r=>`<tr class="cl" onclick="openReq('${r.id}')">${cols.map(c=>"<td>"+c[1](r)+"</td>").join("")}</tr>`).join("")}</table></div>`}
const C={pr:["Protocolo",r=>"<b>"+r.id+"</b>"],dt:["Solicitação",r=>fd(r.dt.slice(0,10))],fr:["Frota",r=>esc(r.fr)],eq:["Equipamento",r=>esc([r.ti,r.ma,r.mo].filter(Boolean).join(" · "))],
 fo:["Fornecedor",r=>esc(r.forn||r.fn)],ge:["Gestor",r=>esc(r.ge)],nr:["Nº requisição",r=>esc(r.nr||"—")],st:["Situação",r=>`<span class="tag ${tagc(r)}">${stLabel(r)}</span>`],
 en:["Envio",r=>fd(r.env)],pv:["Prev. retorno",r=>fd(r.prev)],rt:["Retorno efetivo",r=>fd(r.ret)],sv:["Serviço",r=>esc(r.ds.slice(0,70))+(r.ds.length>70?"…":"")]};
// ---------- telas
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v==view));
 const m=$("#m");let h="";
 if(!db)h='<p class="note">⚠️ Banco não configurado: os dados ficam só neste navegador.</p>';if(err)h+='<p class="note" style="color:var(--red)">'+esc(err)+'</p>';
 if(view=="home")h+=vHome();else if(view=="new")h+=vNew();else if(view=="pcm")h+=vPcm();else if(view=="eq")h+=vEq();else h+=vFr();
 const a=document.activeElement,id=a&&a.id,v=a&&a.value;m.innerHTML=h;if(view=="new"&&id){const e=document.getElementById(id);if(e){if(v!==undefined)e.value=v;e.focus()}}}
function vHome(){const l=filt(reqs);const n=(f)=>l.filter(f).length;
 return `<h2>Painel principal</h2>${fbar()}<div class="kpis">
<div class="kpi"><b>${l.length}</b><span>Total de solicitações</span></div><div class="kpi"><b>${n(r=>r.st=="Pendente")}</b><span>Pendentes de resposta do PCM</span></div>
<div class="kpi"><b>${n(r=>r.st!="Pendente"&&r.st!="Cancelada")}</b><span>Requisições respondidas</span></div><div class="kpi"><b>${n(emTerc)}</b><span>Equipamentos em terceiros</span></div>
<div class="kpi bad"><b>${n(atras)}</b><span>Não retornaram (atrasados)</span></div></div>
<div class="card"><b>Últimas solicitações</b>${table(l.slice().sort((a,b)=>b.dt.localeCompare(a.dt)).slice(0,15),[C.pr,C.dt,C.fr,C.eq,C.fo,C.ge,C.st])}</div>
<button class="btn" onclick="go('new')">+ Nova solicitação</button>`}
function vNew(){const dl=frota.map(x=>`<option value="${esc(x.f)}">${esc(x.ti||"")} ${esc(x.ma||"")}</option>`).join("");
 return `<h2>Nova solicitação de serviço de terceiros</h2>${msg?`<div class="card ok">${msg}</div>`:""}
<form class="card form" onsubmit="sendReq(event)" autocomplete="off">
<label>Nº da frota *<input id="nf" list="fl" required oninput="fillF(this.value)" placeholder="${frota.length?"Digite ou selecione":"Base de frota vazia — digite manualmente"}"><datalist id="fl">${dl}</datalist></label>
<label>Marca<input id="nma"></label><label>Modelo<input id="nmo"></label><label>Tipo<input id="nti"></label>
<label>Fornecedor *<input id="nfo" required></label><label>Nome do gestor *<input id="nge" required value="${esc(ls("ipe_gestor")||"")}"></label>
<label>Estimativa de tempo (dias) *<input id="nes" type="number" min="1" required></label><label>Data da solicitação<input value="${fd(today())}" readonly></label>
<label class="full">Descrição do serviço *<textarea id="nds" required></textarea></label>
<div class="full"><button class="btn">Enviar solicitação</button></div></form>`}
function fillF(v){const x=frota.find(y=>String(y.f)==v.trim());if(x){nma.value=x.ma||"";nmo.value=x.mo||"";nti.value=x.ti||""}}
async function sendReq(e){e.preventDefault();const d=new Date(),p=n=>String(n).padStart(2,"0");
 const id="PCM-"+String(d.getFullYear()).slice(2)+p(d.getMonth()+1)+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
 const r={id,dt:d.toISOString(),fr:nf.value.trim(),ma:nma.value,mo:nmo.value,ti:nti.value,fn:nfo.value.trim(),forn:"",ge:nge.value.trim(),es:+nes.value,ds:nds.value.trim(),st:"Pendente",nr:"",ab:"",env:"",prev:"",ret:"",h:[{d:d.toISOString(),w:nge.value.trim(),t:"Solicitação criada"}]};
 ls("ipe_gestor",r.ge);await saveReq(r);msg=`✅ Solicitação enviada. Protocolo: <b>${id}</b> — guarde este número.`;render();scrollTo(0,0)}
function vPcm(){let l=filt(reqs);const pend=l.filter(r=>r.st=="Pendente");const lst=pf=="pend"?pend:l.filter(r=>r.st!="Cancelada");
 return `<h2>Painel do PCM</h2>${fbar()}<div class="chips"><button class="${pf=="pend"?"on":""}" onclick="pf='pend';render()">Pendentes (${pend.length})</button><button class="${pf=="all"?"on":""}" onclick="pf='all';render()">Todas</button></div>
<div class="card">${table(lst.sort((a,b)=>a.dt.localeCompare(b.dt)),[C.pr,C.dt,C.fr,C.eq,C.fo,C.ge,C.nr,C.st])}<p class="note">Clique em uma linha para tratar a solicitação.</p></div>
<div class="card"><label>E-mail do setor de serviços (usado em “Preparar e-mail”)<input type="email" value="${esc(ls("ipe_mail")||"")}" onchange="ls('ipe_mail',this.value)" placeholder="servicos@usina.com.br"></label></div>`}
function vEq(){const l=filt(reqs).filter(r=>r.st!="Pendente"&&r.st!="Cancelada");
 const k={"":l,env:l.filter(r=>r.st=="Enviado"),ex:l.filter(r=>r.st=="Em execução"),ret:l.filter(r=>r.st=="Retornou"),at:l.filter(atras)};
 const ch=[["","Todos"],["env","Enviados"],["ex","Em execução"],["ret","Retornaram"],["at","Retorno atrasado"]];
 return `<h2>Controle de equipamentos</h2>${fbar()}<div class="chips">${ch.map(c=>`<button class="${chip==c[0]?"on":""}" onclick="chip='${c[0]}';render()">${c[1]} (${k[c[0]].length})</button>`).join("")}</div>
<div class="card">${table(k[chip].sort((a,b)=>(a.prev||"9").localeCompare(b.prev||"9")),[C.fr,C.eq,C.fo,C.pr,C.nr,C.en,C.pv,C.rt,C.st])}</div>`}
function vFr(){return `<h2>Base de frota</h2><div class="card"><p>${frota.length} equipamentos cadastrados.</p><p class="note">Importe a planilha Excel (primeira aba) com colunas de frota/código, marca, modelo e tipo. A importação substitui a base atual.</p>
<input type="file" accept=".xlsx,.xls,.csv" onchange="impF(this.files[0])"><p id="fi" class="note"></p></div>
${frota.length?`<div class="card tw"><table><tr><th>Frota</th><th>Tipo</th><th>Marca</th><th>Modelo</th></tr>${frota.slice(0,50).map(x=>`<tr><td>${esc(x.f)}</td><td>${esc(x.ti)}</td><td>${esc(x.ma)}</td><td>${esc(x.mo)}</td></tr>`).join("")}</table>${frota.length>50?'<p class="note">Mostrando 50 primeiros.</p>':""}</div>`:""}`}
async function impF(file){if(!file)return;try{const wb=XLSX.read(await file.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
 const key=re=>Object.keys(rows[0]||{}).find(k=>re.test(k.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()));
 const kf=key(/frota|codigo|equip|cod/),km=key(/marca|fabric/),ko=key(/modelo/),kt=key(/tipo|classe|descri/);
 if(!kf){$("#fi").textContent="Coluna de frota não encontrada.";return}
 const out=rows.map(r=>({f:String(r[kf]).trim(),ma:km?String(r[km]):"",mo:ko?String(r[ko]):"",ti:kt?String(r[kt]):""})).filter(x=>x.f);
 await saveFrota(out)}catch(e){$("#fi").textContent="Erro ao importar: "+e.message}}
// ---------- detalhe / PCM
const FL={nr:"Nº requisição",forn:"Fornecedor confirmado",ab:"Data de abertura",st:"Situação",env:"Data de envio",prev:"Previsão de retorno",ret:"Retorno efetivo"};
function openReq(id){const r=reqs.find(x=>x.id==id);if(!r)return;$("#dt").textContent="Protocolo "+r.id;
 $("#dbody").innerHTML=`<p><b>Frota ${esc(r.fr)}</b> — ${esc([r.ti,r.ma,r.mo].filter(Boolean).join(" · "))}<br>Gestor: ${esc(r.ge)} · Fornecedor sugerido: ${esc(r.fn)} · Estimativa: ${r.es} dia(s)<br>Serviço: ${esc(r.ds)}</p>
<div class="form"><label>Nº da requisição<input id="e_nr" value="${esc(r.nr)}"></label><label>Fornecedor confirmado<input id="e_forn" value="${esc(r.forn||r.fn)}"></label>
<label>Data de abertura<input id="e_ab" type="date" value="${r.ab}"></label><label>Situação<select id="e_st">${ST.map(s=>`<option ${s==r.st?"selected":""}>${s}</option>`).join("")}</select></label>
<label>Data de envio<input id="e_env" type="date" value="${r.env}" onchange="if(!e_prev.value&&this.value){const d=new Date(this.value);d.setDate(d.getDate()+${r.es||0});e_prev.value=d.toISOString().slice(0,10)}"></label>
<label>Previsão de retorno<input id="e_prev" type="date" value="${r.prev}"></label><label>Retorno efetivo<input id="e_ret" type="date" value="${r.ret}"></label>
<label class="full">Observação (vai para o histórico)<input id="e_ob"></label></div>
<div class="row"><button class="btn" onclick="saveDet('${r.id}')">Salvar</button><button class="btn alt" onclick="mailReq('${r.id}')">✉️ Preparar e-mail</button><button class="btn" style="background:var(--red);margin-left:auto" onclick="delReq('${r.id}')">🗑️ Excluir requisição</button></div>
<h3 style="color:var(--g)">Histórico</h3>${r.h.slice().reverse().map(h=>`<div class="hist">${esc(h.t)}<br><small>${fdt(h.d)} · ${esc(h.w)}</small></div>`).join("")}`;$("#dlg").showModal()}
async function saveDet(id){const r=structuredClone(reqs.find(x=>x.id==id)),w=askWho(),ch=[];
 for(const k in FL){const v=$("#e_"+k).value;if(v!=(r[k]||"")){ch.push(`${FL[k]}: ${k.match(/ab|env|prev|ret/)?fd(r[k]):r[k]||"—"} → ${k.match(/ab|env|prev|ret/)?fd(v):v||"—"}`);r[k]=v}}
 if(r.nr&&r.st=="Pendente"){r.st="Requisição aberta";ch.push("Situação: Pendente → Requisição aberta (automático)")}
 if(r.ret&&r.st!="Retornou"&&r.st!="Cancelada"){r.st="Retornou";ch.push("Situação → Retornou (automático)")}
 const ob=$("#e_ob").value.trim();if(ob)ch.push("Obs.: "+ob);
 if(ch.length){r.h.push({d:new Date().toISOString(),w,t:ch.join(" | ")});await saveReq(r)}dlg.close()}
function mailReq(id){const r=reqs.find(x=>x.id==id),g=k=>$("#e_"+k)?.value||"";
 const body=`Prezados,\n\nSegue solicitação de serviço de terceiros:\n\nProtocolo: ${r.id}\nNº da requisição: ${g("nr")||"—"}\nData de abertura: ${fd(g("ab"))}\nFrota: ${r.fr}\nEquipamento: ${[r.ti,r.ma,r.mo].filter(Boolean).join(" / ")}\nFornecedor: ${g("forn")}\nServiço: ${r.ds}\nGestor solicitante: ${r.ge}\nEstimativa: ${r.es} dia(s)\nData da solicitação: ${fd(r.dt.slice(0,10))}\n\nAtenciosamente,\nPCM – Usina Ipê`;
 location.href=`mailto:${ls("ipe_mail")||""}?subject=${encodeURIComponent("Requisição de serviço de terceiros – "+r.id+" – Frota "+r.fr)}&body=${encodeURIComponent(body)}`;
 const rr=structuredClone(r);rr.h.push({d:new Date().toISOString(),w:askWho(),t:"E-mail ao setor de serviços preparado"});saveReq(rr)}
async function delReq(id){if(!confirm("Excluir a solicitação "+id+"? O histórico dela também será apagado e isso não pode ser desfeito."))return;
